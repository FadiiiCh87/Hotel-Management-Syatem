name: PK-Hotels API build
on:
  push:
    branches:
      - feature/pk-hotels-phase2-billing
  pull_request:
jobs:
  api-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify operational workflow
        run: npm test
      - name: Build staff dashboard
        run: npm run build -w @hms/web
